<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <label for="">Choose flowers:</label>
        <input type="number" name="" id="ruza" placeholder="Price per flower is 150 RSD."> Roses <br>
        <input type="number" name="" id="lili" placeholder="Price per flower is 120 RSD."> Lilies <br>
        <input type="number" name="" id="gerber" placeholder="Price per flower is 70 RSD."> Gerberas <br>

        <label for="">Additional gifts:</label>
        <input type="checkbox" name="gifts" id="bombo" value="500"> Box of Chocolates <br>
        <input type="checkbox" name="gifts" id="coko" value="500"> Chocolate <br>
        <input type="checkbox" name="gifts" id="sampanj" value="500"> Champagne <br>

        <label for="">Payment:</label>
        <p><em>If your order total is over 20$ and you pay by card, <br>you will receive a <strong>10%</strong> discount.</em></p>
        <br>
        <input type="radio" name="payment" id="cash" value="cash" checked> Cash <br>
        <input type="radio" name="payment" id="card" value="card"> Card <br>

        <input type="submit" value="Calculate" id="calculate">
        <input type="reset" value="Reset" id="reset">
    </form>

    <div id="output">
        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
